<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script İsteği - Klakz Hub</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        .form-box { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid var(--border); padding: 30px; border-radius: 16px; width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 15px; margin-bottom: 40px; }
        .form-input { width: 100%; padding: 14px 20px; background: rgba(11, 12, 16, 0.6); border: 1px solid var(--border); border-radius: 12px; color: white; font-size: 15px; outline: none; transition: 0.3s; }
        .form-input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }
    </style>
</head>
<body>

    <div class="announcement-bar" id="topAnnouncement">Yükleniyor...</div>

    <header>
        <div class="logo">KLAKZ HUB</div>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="script.html">Scriptler</a>
            <a href="status.html">Durum</a>
            <a href="executors.html">Executor Rehberi</a>
            <a href="network.html">Projelerim</a>
            <a href="key.html">Key Sistemi</a>
            <a href="changelog.html">Güncellemeler</a>
            <a href="faq.html">SSS</a>
            <a href="request.html" class="active">İstek</a>
            <a href="admin.html" style="color: var(--accent); font-weight: 700;">⚙️ Admin</a>
        </nav>
    </header>

    <div class="container" style="justify-content: flex-start;">
        <h1 style="font-size: 36px; margin-top: 20px;">Script <span>İstek Formu</span></h1>
        <p style="margin-bottom: 30px; color: var(--text-muted);">Oynadığın ve sitemizde görmek istediğin oyunun scriptini buraya yazarak bize bildirebilirsin.</p>

        <div class="form-box">
            <input type="text" id="gameName" class="form-input" placeholder="Oyun Adı (Örn: Blox Fruits, Arsenal...)">
            <textarea id="gameDesc" class="form-input" placeholder="İstediğin özellikler neler? (Örn: Auto Farm, ESP...)" style="height: 120px; resize: none;"></textarea>
            <button class="btn" style="justify-content: center; padding: 14px;" onclick="sendRequest()">🚀 İsteği Gönder</button>
        </div>
    </div>

    <div id="toast">Bildirim mesajı</div>
    <footer><p>&copy; 2026 Klakz Hub. Tüm hakları saklıdır.</p></footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAJuMNSxWFuNTO0xGriUo8QoaC9g-ie8WM",
            authDomain: "klakz-database.firebaseapp.com",
            databaseURL: "https://klakz-database-default-rtdb.firebaseio.com",
            projectId: "klakz-database",
            storageBucket: "klakz-database.firebasestorage.app",
            messagingSenderId: "437747915577",
            appId: "1:437747915577:web:f4ffa2f76d6d7a923966e8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        window.addEventListener('DOMContentLoaded', () => {
            db.ref('announcement').on('value', snap => {
                document.getElementById('topAnnouncement').textContent = snap.val() || "";
            });
        });

        function sendRequest() {
            let name = document.getElementById('gameName').value.trim();
            let desc = document.getElementById('gameDesc').value.trim();
            if(!name) {
                showToast("⚠ Lütfen oyun adını yazın!");
                return;
            }

            db.ref('requests').push({
                game: name,
                details: desc,
                time: new Date().toLocaleString()
            }).then(() => {
                showToast("✅ İstek başarıyla gönderildi!");
                document.getElementById('gameName').value = "";
                document.getElementById('gameDesc').value = "";
            });
        }

        function toggleMenu() { document.querySelector('nav').classList.toggle('active'); }
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }
    </script>
</body>
</html>
