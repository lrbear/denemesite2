<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script İstegi - Klakz Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        let isVerified = localStorage.getItem('klakz_verified');
        let expireTime = localStorage.getItem('klakz_expire');
        let now = new Date().getTime();
        if (!isVerified || !expireTime || now > parseInt(expireTime)) {
            localStorage.removeItem('klakz_verified');
            localStorage.removeItem('klakz_expire');
            window.location.href = 'key.html';
        }
    </script>
    <style>
        .request-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 30px; width: 100%; max-width: 600px; backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 15px; }
        .form-input, .form-textarea { width: 100%; padding: 14px 20px; background: rgba(11, 12, 16, 0.6); border: 1px solid var(--border); border-radius: 12px; color: white; font-size: 15px; outline: none; transition: 0.3s; }
        .form-input:focus, .form-textarea:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }
        .form-textarea { resize: vertical; min-height: 120px; }
        .btn-submit { background: var(--primary); border: none; color: white; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; width: 100%; font-size: 15px; }
        .btn-submit:hover { background: var(--primary-hover); }
    </style>
</head>
<body>

    <div class="announcement-bar" id="topAnnouncement">Yükleniyor...</div>

    <header>
        <div class="logo">KLAKZ HUB</div>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="script.html">Scriptler</a>
            <a href="status.html">Durum</a>
            <a href="executors.html">Executor Rehberi</a>
            <a href="network.html">Projelerim</a>
            <a href="key.html">Key Sistemi</a>
            <a href="changelog.html">Güncellemeler</a>
            <a href="faq.html">SSS</a>
            <a href="request.html" class="active">İstek</a>
            <a href="admin.html" style="color: var(--accent); font-weight: 700;">⚙️ Admin</a>
        </nav>
    </header>

    <div class="container" style="align-items: center;">
        <h1 style="font-size: 36px; margin-bottom: 10px;">Script <span>İsteği</span></h1>
        <p style="color: var(--text-muted); margin-bottom: 30px; text-align: center;">Oynadığın ve sitemizde görmek istediğin oyunları veya scriptleri bize bildir.</p>

        <div class="request-box">
            <input type="text" id="gameName" class="form-input" placeholder="Oyun Adı (Örn: Blox Fruits)">
            <textarea id="gameDetails" class="form-textarea" placeholder="İstediğin özellikler veya detaylar..."></textarea>
            <button class="btn-submit" onclick="sendRequest()">İsteği Gönder</button>
        </div>
    </div>

    <div id="toast">Bildirim mesajı</div>
    <footer><p>&copy; 2026 Klakz Hub. Tüm hakları saklıdır.</p></footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAJuMNSxWFuNTO0xGriUo8QoaC9g-ie8WM",
            authDomain: "klakz-database.firebaseapp.com",
            databaseURL: "https://klakz-database-default-rtdb.firebaseio.com",
            projectId: "klakz-database",
            storageBucket: "klakz-database.firebasestorage.app",
            messagingSenderId: "437747915577",
            appId: "1:437747915577:web:f4ffa2f76d6d7a923966e8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('announcement').on('value', snap => {
            document.getElementById('topAnnouncement').textContent = snap.val() || "";
        });

        function sendRequest() {
            let name = document.getElementById('gameName').value.trim();
            let details = document.getElementById('gameDetails').value.trim();

            if(!name) {
                showToast("❌ Lütfen oyun adını yazın!");
                return;
            }

            db.ref('requests').push({
                game: name,
                details: details || "Detay belirtilmemiş.",
                time: new Date().toLocaleString()
            }).then(() => {
                showToast("✅ İstek başarıyla yöneticiye iletildi!");
                document.getElementById('gameName').value = "";
                document.getElementById('gameDetails').value = "";
            });
        }

        function toggleMenu() { document.querySelector('nav').classList.toggle('active'); }
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }
    </script>
</body>
</html>
