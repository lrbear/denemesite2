<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Sistemi - Klakz Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        .key-box { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid var(--border); padding: 40px; border-radius: 16px; width: 100%; max-width: 500px; text-align: center; display: flex; flex-direction: column; gap: 20px; margin-top: 40px; }
        .key-input { width: 100%; padding: 14px 20px; background: rgba(11, 12, 16, 0.6); border: 1px solid var(--border); border-radius: 12px; color: white; font-size: 16px; text-align: center; outline: none; transition: 0.3s; }
        .key-input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }
        .btn-main { background: var(--primary); border: none; color: white; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 15px; transition: 0.2s; width: 100%; }
        .btn-main:hover { background: var(--primary-hover); }
    </style>
</head>
<body>

    <div class="announcement-bar" id="topAnnouncement">Yükleniyor...</div>

    <header>
        <div class="logo">KLAKZ HUB</div>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="script.html">Scriptler</a>
            <a href="status.html">Durum</a>
            <a href="executors.html">Executor Rehberi</a>
            <a href="network.html">Projelerim</a>
            <a href="key.html" class="active">Key Sistemi</a>
            <a href="changelog.html">Güncellemeler</a>
            <a href="faq.html">SSS</a>
            <a href="request.html">İstek</a>
            <a href="admin.html" style="color: var(--accent); font-weight: 700;">⚙️ Admin</a>
        </nav>
    </header>

    <div class="container">
        <div class="key-box">
            <h2 style="font-size: 26px;">🔑 Erişim Anahtarı (Key)</h2>
            <p style="color: var(--text-muted); font-size: 14px;">Scriptlere erişmek için lütfen key giriniz. Girilen key <strong>24 saat</strong> boyunca geçerli olacaktır.</p>
            <input type="text" id="keyInput" class="key-input" placeholder="Key'inizi buraya girin...">
            <button class="btn-main" onclick="verifyKey()">Doğrula ve Devam Et</button>
        </div>
    </div>

    <div id="toast">Bildirim mesajı</div>
    <footer><p>&copy; 2026 Klakz Hub. Tüm hakları saklıdır.</p></footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAJuMNSxWFuNTO0xGriUo8QoaC9g-ie8WM",
            authDomain: "klakz-database.firebaseapp.com",
            databaseURL: "https://klakz-database-default-rtdb.firebaseio.com",
            projectId: "klakz-database",
            storageBucket: "klakz-database.firebasestorage.app",
            messagingSenderId: "437747915577",
            appId: "1:437747915577:web:f4ffa2f76d6d7a923966e8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('announcement').on('value', snap => {
            document.getElementById('topAnnouncement').textContent = snap.val() || "";
        });

        function verifyKey() {
            let inputKey = document.getElementById('keyInput').value.trim();
            if(inputKey.length > 0) {
                let expireTime = new Date().getTime() + (24 * 60 * 60 * 1000);
                localStorage.setItem('klakz_verified', 'true');
                localStorage.setItem('klakz_expire', expireTime);

                showToast("✅ Key başarıyla doğrulandı!");
                setTimeout(() => { window.location.href = "script.html"; }, 1000);
            } else {
                showToast("❌ Lütfen geçerli bir key girin!");
            }
        }

        function toggleMenu() { document.querySelector('nav').classList.toggle('active'); }
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }
    </script>
</body>
</html>
