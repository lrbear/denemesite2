<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Sistemi - Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .key-box { background: var(--card-bg); backdrop-filter: blur(12px); padding: 35px; border-radius: 20px; border: 1px solid var(--border); max-width: 450px; width: 100%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .form-control { width: 100%; padding: 14px 16px; background: rgba(11, 12, 16, 0.6); border: 1px solid var(--border); border-radius: 12px; color: white; font-size: 15px; outline: none; margin-bottom: 20px; text-align: center; transition: 0.3s; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }
    </style>
</head>
<body>

    <div class="announcement-bar" id="topAnnouncement">Yükleniyor...</div>

    <header>
        <div class="logo">HUB SYSTEM</div>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="script.html">Scriptler</a>
            <a href="status.html">Durum</a>
            <a href="network.html">Projelerim</a>
            <a href="key.html" class="active">Key Sistemi</a>
            <a href="admin.html" style="color: var(--accent); font-weight: 700;">⚙️ Admin</a>
            <div class="theme-picker">
                <div class="theme-dot" style="background:#6366f1;" onclick="setTheme('')"></div>
                <div class="theme-dot" style="background:#10b981;" onclick="setTheme('theme-green')"></div>
                <div class="theme-dot" style="background:#ef4444;" onclick="setTheme('theme-red')"></div>
            </div>
        </nav>
    </header>

    <div class="container">
        <div class="key-box">
            <h1 style="font-size: 28px; margin-bottom: 10px;">🔑 Key <span>Doğrulama</span></h1>
            <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 25px;">Scriptlere erişim sağlamak için geçerli bir key girin veya key alın.</p>
            
            <input type="text" id="keyInput" class="form-control" placeholder="Key'inizi buraya girin...">
            <div style="display: flex; gap: 10px; flex-direction: column;">
                <button class="btn" style="width: 100%; justify-content: center;" onclick="verifyKey()">Key'i Doğrula</button>
                <a href="#" class="btn btn-secondary" style="width: 100%; justify-content: center; text-decoration: none;" onclick="getKey(event)">Key Al (Get Key)</a>
            </div>
        </div>
    </div>

    <div id="toast">Bildirim mesajı</div>
    <footer>
        <p>&copy; 2026 Hub System. Tüm hakları saklıdır.</p>
        <a href="https://discord.gg/senindiscordlinkin" target="_blank" class="discord-badge">💬 Discord</a>
    </footer>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const savedTheme = localStorage.getItem('hub_theme');
            if (savedTheme) document.body.className = savedTheme;

            try {
                let res = await fetch('scripts.json?' + new Date().getTime());
                let data = await res.json();
                document.getElementById('topAnnouncement').textContent = data.announcement;
            } catch(e) {
                document.getElementById('topAnnouncement').textContent = "🔥 v3.2 Güncellemesi Yayında!";
            }

            // Eğer daha önceden key doğrulanmışsa inputu doldur
            let savedKey = localStorage.getItem('hub_user_key');
            if(savedKey) {
                document.getElementById('keyInput').value = savedKey;
            }
        });

        function verifyKey() {
            let key = document.getElementById('keyInput').value.trim();
            if(!key) {
                showToast("⚠ Lütfen bir key girin!");
                return;
            }
            // Örnek doğrulama mantığı (istediğin gibi özelleştirebilirsin)
            if(key.startsWith("HUB-")) {
                localStorage.setItem('hub_user_key', key);
                showToast("✨ Key başarıyla doğrulandı!");
                setTimeout(() => { window.location.href = "script.html"; }, 1500);
            } else {
                showToast("❌ Geçersiz veya hatalı key!");
            }
        }

        function getKey(e) {
            e.preventDefault();
            showToast("🔗 Key alma sayfasına yönlendiriliyorsunuz...");
            // Buraya reklam/linkvertise linkini ekleyebilirsin
            setTimeout(() => {
                let generatedKey = "HUB-" + Math.floor(100000 + Math.random() * 900000);
                document.getElementById('keyInput').value = generatedKey;
                showToast("🔑 Yeni key'iniz oluşturuldu ve yazıldı!");
            }, 1000);
        }

        function setTheme(themeClass) {
            document.body.className = themeClass;
            localStorage.setItem('hub_theme', themeClass);
        }
        function toggleMenu() { document.querySelector('nav').classList.toggle('active'); }
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }
    </script>
</body>
</html>
