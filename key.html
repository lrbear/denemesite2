<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Sistemi - Klakz Hub</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        .key-box { background: var(--card-bg); backdrop-filter: blur(12px); padding: 40px; border-radius: 20px; border: 1px solid var(--border); max-width: 450px; width: 100%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .form-control { width: 100%; padding: 14px 18px; background: rgba(11, 12, 16, 0.6); border: 1px solid var(--border); border-radius: 12px; color: white; font-size: 15px; outline: none; margin-bottom: 20px; text-align: center; transition: 0.3s; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }
        .divider { margin: 20px 0; border: none; height: 1px; background: var(--border); }
    </style>
</head>
<body>

    <div class="announcement-bar" id="topAnnouncement">Yükleniyor...</div>

    <header>
        <div class="logo">KLAKZ HUB</div>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="script.html">Scriptler</a>
            <a href="status.html">Durum</a>
            <a href="network.html">Projelerim</a>
            <a href="key.html" class="active">Key Sistemi</a>
            <a href="admin.html" style="color: var(--accent); font-weight: 700;">⚙️ Admin</a>
        </nav>
    </header>

    <div class="container">
        <div class="key-box">
            <h1 style="font-size: 28px; margin-bottom: 10px;">Key <span>Doğrulama</span></h1>
            <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 25px;">Özel scriptlere erişim sağlamak için anahtarınızı girin ya da yeni bir anahtar edinin.</p>
            
            <!-- KEY GİRİŞ ALANI -->
            <input type="text" id="userKeyInput" class="form-control" placeholder="Anahtarınızı buraya yazın...">
            <button class="btn" style="width: 100%; justify-content: center; margin-bottom: 10px;" onclick="verifyKey()">🔑 Key'i Doğrula</button>

            <hr class="divider">

            <!-- KEY AL / REKLAM BUTONU -->
            <p style="color: var(--text-muted); font-size: 12px; margin-bottom: 12px;">Anahtarınız yok mu?</p>
            <a href="https://link-hub.net/8271059/CVtOONc9i5N0" target="_blank" class="btn" style="width: 100%; justify-content: center; background: rgba(255,255,255,0.05); border: 1px solid var(--border);" onclick="getKeyClicked()">🔗 Key Al (Reklama Git)</a>
        </div>
    </div>

    <div id="toast">Bildirim mesajı</div>
    <footer><p>&copy; 2026 Klakz Hub. Tüm hakları saklıdır.</p></footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAJuMNSxWFuNTO0xGriUo8QoaC9g-ie8WM",
            authDomain: "klakz-database.firebaseapp.com",
            databaseURL: "https://klakz-database-default-rtdb.firebaseio.com",
            projectId: "klakz-database",
            storageBucket: "klakz-database.firebasestorage.app",
            messagingSenderId: "437747915577",
            appId: "1:437747915577:web:f4ffa2f76d6d7a923966e8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        window.addEventListener('DOMContentLoaded', () => {
            db.ref('announcement').on('value', snap => {
                document.getElementById('topAnnouncement').textContent = snap.val() || "";
            });
            if(localStorage.getItem("hub_verified") === "true") {
                showToast("✅ Zaten onaylısınız!");
            }
        });

        function verifyKey() {
            let userKey = document.getElementById("userKeyInput").value.trim();
            if(!userKey) { showToast("⚠ Lütfen bir key girin!"); return; }

            db.ref('validKey').once('value').then(snap => {
                let correctKey = snap.val() || "klakz2026";
                if(userKey === correctKey) {
                    localStorage.setItem("hub_verified", "true");
                    showToast("🎉 Key başarıyla doğrulandı!");
                    setTimeout(() => { window.location.href = "script.html"; }, 1500);
                } else {
                    showToast("❌ Geçersiz anahtar!");
                }
            });
        }

        function getKeyClicked() {
            showToast("🔗 Reklam sayfasına yönlendiriliyorsunuz...");
        }

        function toggleMenu() { document.querySelector('nav').classList.toggle('active'); }
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }
    </script>
</body>
</html>
