<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAJuMNSxWFuNTO0xGriUo8QoaC9g-ie8WM",
        authDomain: "klakz-database.firebaseapp.com",
        databaseURL: "https://klakz-database-default-rtdb.firebaseio.com",
        projectId: "klakz-database",
        storageBucket: "klakz-database.firebasestorage.app",
        messagingSenderId: "437747915577",
        appId: "1:437747915577:web:f4ffa2f76d6d7a923966e8"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function verifyKey() {
        let userKey = document.getElementById('keyInput').value.trim();
        if(!userKey) { alert("Lütfen bir key girin!"); return; }

        db.ref('validKeys').once('value').then(snapshot => {
            let keysObj = snapshot.val();
            let isValid = false;

            if(keysObj) {
                Object.values(keysObj).forEach(k => {
                    if(k === userKey) isValid = true;
                });
            }

            if(isValid) {
                let expireTime = new Date().getTime() + (24 * 60 * 60 * 1000); // 24 saat geçerli
                localStorage.setItem('klakz_verified', 'true');
                localStorage.setItem('klakz_expire', expireTime);
                alert("✅ Key doğrulandı! Ana sayfaya yönlendiriliyorsunuz.");
                window.location.href = 'index.html';
            } else {
                alert("❌ Geçersiz veya süresi dolmuş key!");
            }
        });
    }
</script>
