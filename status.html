<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Durum - Klakz Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        let isVerified = localStorage.getItem('klakz_verified');
        let expireTime = localStorage.getItem('klakz_expire');
        let now = new Date().getTime();
        if (!isVerified || !expireTime || now > parseInt(expireTime)) {
            localStorage.removeItem('klakz_verified');
            localStorage.removeItem('klakz_expire');
            window.location.href = 'key.html';
        }
    </script>
    <style>
        .status-grid { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 800px; }
        .status-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px); }
        .badge { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; }
        .badge.working { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge.updating { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge.patched { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    </style>
</head>
<body>

    <div class="announcement-bar" id="topAnnouncement">Yükleniyor...</div>

    <header>
        <div class="logo">KLAKZ HUB</div>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="script.html">Scriptler</a>
            <a href="status.html" class="active">Durum</a>
            <a href="executors.html">Executor Rehberi</a>
            <a href="network.html">Projelerim</a>
            <a href="key.html">Key Sistemi</a>
            <a href="changelog.html">Güncellemeler</a>
            <a href="request.html">İstek</a>
            <a href="admin.html" style="color: var(--accent); font-weight: 700;">⚙️ Admin</a>
        </nav>
    </header>

    <div class="container" style="align-items: center;">
        <h1 style="font-size: 36px; margin-bottom: 10px;">Sistem ve Executor <span>Durumu</span></h1>
        <p style="color: var(--text-muted); margin-bottom: 30px; text-align: center;">Admin paneli tarafından güncellenen anlık çalışma durumları.</p>

        <div class="status-grid" id="statusGrid">
            <p style="color: var(--text-muted); text-align: center;">Durumlar yükleniyor...</p>
        </div>
    </div>

    <div id="toast">Bildirim mesajı</div>
    <footer><p>&copy; 2026 Klakz Hub. Tüm hakları saklıdır.</p></footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAJuMNSxWFuNTO0xGriUo8QoaC9g-ie8WM",
            authDomain: "klakz-database.firebaseapp.com",
            databaseURL: "https://klakz-database-default-rtdb.firebaseio.com",
            projectId: "klakz-database",
            storageBucket: "klakz-database.firebasestorage.app",
            messagingSenderId: "437747915577",
            appId: "1:437747915577:web:f4ffa2f76d6d7a923966e8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('announcement').on('value', snap => {
            document.getElementById('topAnnouncement').textContent = snap.val() || "";
        });

        db.ref('statuses').on('value', snap => {
            const data = snap.val();
            const grid = document.getElementById('statusGrid');
            grid.innerHTML = "";

            if(!data) {
                grid.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Henüz durum verisi girilmemiş.</p>';
                return;
            }

            Object.keys(data).forEach(key => {
                let st = data[key];
                let badgeClass = "working";
                if(st.state.includes("Güncelleniyor")) badgeClass = "updating";
                if(st.state.includes("Patlak")) badgeClass = "patched";

                grid.innerHTML += `
                    <div class="status-card">
                        <strong style="color: white; font-size: 16px;">${st.name}</strong>
                        <span class="badge ${badgeClass}">${st.state}</span>
                    </div>
                `;
            });
        });

        function toggleMenu() { document.querySelector('nav').classList.toggle('active'); }
    </script>
</body>
</html>
