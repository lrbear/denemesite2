<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Durum - Hub</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; width: 100%; max-width: 900px; margin-bottom: 40px; }
        .status-card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid var(--border); padding: 22px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .status-card:hover { border-color: var(--primary); transform: translateY(-3px); }
        .status-badge { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
        .status-working { background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
        .status-maintenance { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
        .status-updating { background: rgba(245, 158, 11, 0.1); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.2); }
    </style>
</head>
<body>

    <div class="announcement-bar" id="topAnnouncement">Yükleniyor...</div>

    <header>
        <div class="logo">HUB SYSTEM</div>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="script.html">Scriptler</a>
            <a href="status.html" class="active">Durum</a>
            <a href="network.html">Projelerim</a>
            <a href="key.html">Key Sistemi</a>
            <a href="admin.html" style="color: var(--accent); font-weight: 700;">⚙️ Admin</a>
        </nav>
    </header>

    <div class="container" style="justify-content: flex-start;">
        <h1 style="font-size: 36px; margin-top: 20px;">Sistem <span>Durumu</span></h1>
        <p style="margin-bottom: 30px;">Scriptlerin ve oyunların anlık güncel çalışma durumlarını buradan takip edebilirsin.</p>

        <div class="status-grid" id="statusGrid"></div>
    </div>

    <footer>
        <p>&copy; 2026 Hub System. Tüm hakları saklıdır.</p>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "BURAYA_API_KEY", authDomain: "BURAYA_AUTH_DOMAIN",
            databaseURL: "BURAYA_DATABASE_URL", projectId: "BURAYA_PROJECT_ID",
            storageBucket: "BURAYA_STORAGE_BUCKET", messagingSenderId: "BURAYA_MESSAGING_SENDER_ID", appId: "BURAYA_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        window.addEventListener('DOMContentLoaded', () => {
            // Duyuru Dinle
            db.ref('announcement').on('value', snap => {
                document.getElementById('topAnnouncement').textContent = snap.val() || "🔥 Durum Sistemi Aktif!";
            });

            // Durumları Gerçek Zamanlı Dinle
            db.ref('statuses').on('value', snap => {
                let data = snap.val();
                let statusesArray = data ? Object.keys(data).map(key => data[key]) : [];
                renderStatuses(statusesArray);
            });
        });

        function renderStatuses(statuses) {
            const grid = document.getElementById('statusGrid');
            grid.innerHTML = "";
            if(statuses.length === 0) {
                grid.innerHTML = "<p style='color:var(--text-muted);'>Kayıtlı durum bulunamadı.</p>";
                return;
            }

            statuses.forEach(item => {
                let badgeClass = "status-maintenance";
                let icon = "🔴";
                
                if(item.state === "Çalışıyor") {
                    badgeClass = "status-working";
                    icon = "🟢";
                } else if(item.state === "Güncelleniyor") {
                    badgeClass = "status-updating";
                    icon = "🟡";
                }

                grid.innerHTML += `
                    <div class="status-card">
                        <div>
                            <h3 style="color:#fff; font-size:18px; margin-bottom:4px;">${item.name}</h3>
                            <span style="font-size:12px; color:var(--text-muted);">Anlık Durum Kontrolü</span>
                        </div>
                        <div class="status-badge ${badgeClass}">
                            ${icon} ${item.state}
                        </div>
                    </div>
                `;
            });
        }
        function toggleMenu() { document.querySelector('nav').classList.toggle('active'); }
    </script>
</body>
</html>
