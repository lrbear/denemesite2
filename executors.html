<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executor Rehberi - Klakz Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        let isVerified = localStorage.getItem('klakz_verified');
        let expireTime = localStorage.getItem('klakz_expire');
        let now = new Date().getTime();
        if (!isVerified || !expireTime || now > parseInt(expireTime)) {
            localStorage.removeItem('klakz_verified');
            localStorage.removeItem('klakz_expire');
            window.location.href = 'key.html';
        }
    </script>
    <style>
        .exec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; width: 100%; max-width: 1000px; }
        .exec-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 25px; display: flex; flex-direction: column; gap: 15px; backdrop-filter: blur(10px); transition: 0.3s; }
        .exec-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .exec-logo { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; background: #1a1c23; }
        .btn-download { background: var(--primary); color: white; text-decoration: none; padding: 12px; border-radius: 10px; font-weight: 700; text-align: center; display: block; transition: 0.2s; }
        .btn-download:hover { background: var(--primary-hover); }
    </style>
</head>
<body>

    <div class="announcement-bar" id="topAnnouncement">Yükleniyor...</div>

    <header>
        <div class="logo">KLAKZ HUB</div>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="script.html">Scriptler</a>
            <a href="status.html">Durum</a>
            <a href="executors.html" class="active">Executor Rehberi</a>
            <a href="network.html">Projelerim</a>
            <a href="key.html">Key Sistemi</a>
            <a href="changelog.html">Güncellemeler</a>
            <a href="request.html">İstek</a>
            <a href="admin.html" style="color: var(--accent); font-weight: 700;">⚙️ Admin</a>
        </nav>
    </header>

    <div class="container" style="align-items: center;">
        <h1 style="font-size: 36px; margin-bottom: 10px;">Executor <span>Rehberi</span></h1>
        <p style="color: var(--text-muted); margin-bottom: 30px; text-align: center;">Güvenilir executorları incele ve resmi adreslerinden indir.</p>

        <div class="exec-grid" id="execGrid">
            <p style="color: var(--text-muted); grid-column: 1/-1; text-align: center;">Executorlar yükleniyor...</p>
        </div>
    </div>

    <div id="toast">Bildirim mesajı</div>
    <footer><p>&copy; 2026 Klakz Hub. Tüm hakları saklıdır.</p></footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAJuMNSxWFuNTO0xGriUo8QoaC9g-ie8WM",
            authDomain: "klakz-database.firebaseapp.com",
            databaseURL: "https://klakz-database-default-rtdb.firebaseio.com",
            projectId: "klakz-database",
            storageBucket: "klakz-database.firebasestorage.app",
            messagingSenderId: "437747915577",
            appId: "1:437747915577:web:f4ffa2f76d6d7a923966e8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('announcement').on('value', snap => {
            document.getElementById('topAnnouncement').textContent = snap.val() || "";
        });

        db.ref('executors').on('value', snap => {
            const data = snap.val();
            const grid = document.getElementById('execGrid');
            grid.innerHTML = "";

            if(!data) {
                grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center;">Henüz executor eklenmemiş.</p>';
                return;
            }

            Object.keys(data).forEach(key => {
                let e = data[key];
                let img = e.image && e.image.trim() !== "" ? e.image : "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop&q=60";
                grid.innerHTML += `
                    <div class="exec-card">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <img src="${img}" class="exec-logo" alt="Logo">
                            <div>
                                <strong style="color: white; font-size: 18px;">${e.name}</strong>
                                <p style="color: var(--text-muted); font-size: 12px; margin-top: 2px;">Güvenli ve Güncel</p>
                            </div>
                        </div>
                        <p style="color: var(--text-muted); font-size: 13px; flex: 1;">${e.desc || "Açıklama belirtilmemiş."}</p>
                        <a href="${e.link}" target="_blank" class="btn-download">İndir / Git</a>
                    </div>
                `;
            });
        });

        function toggleMenu() { document.querySelector('nav').classList.toggle('active'); }
    </script>
</body>
</html>
