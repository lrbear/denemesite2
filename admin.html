<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Paneli - Klakz Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        .admin-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 25px; width: 100%; max-width: 800px; margin-bottom: 25px; backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 15px; }
        .admin-input { width: 100%; padding: 12px 18px; background: rgba(11, 12, 16, 0.6); border: 1px solid var(--border); border-radius: 10px; color: white; font-size: 14px; outline: none; }
        .admin-input:focus { border-color: var(--primary); }
        
        /* Modern Admin Butonları */
        .admin-btn { background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: white; border: none; padding: 12px 20px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.3s ease; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); text-align: center; }
        .admin-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(99, 102, 241, 0.5); }
        .admin-btn-danger { background: linear-gradient(135deg, var(--danger), #dc2626); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
        .admin-btn-danger:hover { box-shadow: 0 6px 16px rgba(239, 68, 68, 0.5); }

        .list-item { background: rgba(11, 12, 16, 0.4); border: 1px solid var(--border); padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    </style>
</head>
<body>

    <div class="announcement-bar" id="topAnnouncement">Yükleniyor...</div>

    <header>
        <div class="logo">KLAKZ HUB</div>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="script.html">Scriptler</a>
            <a href="status.html">Durum</a>
            <a href="executors.html">Executor Rehberi</a>
            <a href="network.html">Projelerim</a>
            <a href="key.html">Key Sistemi</a>
            <a href="changelog.html">Güncellemeler</a>
            <a href="faq.html">SSS</a>
            <a href="request.html">İstek</a>
            <a href="admin.html" class="active" style="color: var(--accent); font-weight: 700;">⚙️ Admin</a>
        </nav>
    </header>

    <div class="container" style="align-items: center;">
        <h1 style="font-size: 36px; margin-bottom: 25px;">Yönetici <span>Paneli</span></h1>

        <!-- Duyuru Yönetimi -->
        <div class="admin-section">
            <h3>📢 Site Duyurusu Düzenle</h3>
            <input type="text" id="announcementInput" class="admin-input" placeholder="Yeni duyuru metnini yazın...">
            <button class="admin-btn" onclick="updateAnnouncement()">Duyuruyu Güncelle</button>
        </div>

        <!-- Script Ekleme -->
        <div class="admin-section">
            <h3>➕ Yeni Script Ekle</h3>
            <input type="text" id="scriptTitle" class="admin-input" placeholder="Oyun / Script Adı">
            <input type="text" id="scriptDesc" class="admin-input" placeholder="Kısa Açıklama">
            <input type="text" id="scriptImage" class="admin-input" placeholder="Görsel URL (İsteğe bağlı)">
            <textarea id="scriptCode" class="admin-input" style="resize: vertical; min-height: 80px;" placeholder="Lua Script Kodu..."></textarea>
            <button class="admin-btn" onclick="addScript()">Scripti Yayınla</button>
        </div>

        <!-- Gelen İstekler Listesi -->
        <div class="admin-section">
            <h3>📥 Kullanıcı Script İstekleri</h3>
            <div id="requestsList" style="display: flex; flex-direction: column; gap: 10px;">
                <p style="color: var(--text-muted); text-align: center;">İstekler yükleniyor...</p>
            </div>
        </div>
    </div>

    <div id="toast">Bildirim mesajı</div>
    <footer><p>&copy; 2026 Klakz Hub. Tüm hakları saklıdır.</p></footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAJuMNSxWFuNTO0xGriUo8QoaC9g-ie8WM",
            authDomain: "klakz-database.firebaseapp.com",
            databaseURL: "https://klakz-database-default-rtdb.firebaseio.com",
            projectId: "klakz-database",
            storageBucket: "klakz-database.firebasestorage.app",
            messagingSenderId: "437747915577",
            appId: "1:437747915577:web:f4ffa2f76d6d7a923966e8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('announcement').on('value', snap => {
            let val = snap.val() || "";
            document.getElementById('topAnnouncement').textContent = val;
            document.getElementById('announcementInput').value = val;
        });

        // İstekleri Dinle ve Listele
        db.ref('requests').on('value', snap => {
            const data = snap.val();
            const list = document.getElementById('requestsList');
            list.innerHTML = "";

            if(!data) {
                list.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Henüz gelen bir istek yok.</p>';
                return;
            }

            Object.keys(data).forEach(key => {
                let req = data[key];
                list.innerHTML += `
                    <div class="list-item">
                        <div>
                            <strong style="color: white; font-size: 15px;">${req.game}</strong>
                            <p style="color: var(--text-muted); font-size: 13px; margin-top: 3px;">${req.details}</p>
                            <span style="font-size: 11px; color: var(--primary);">${req.time}</span>
                        </div>
                        <button class="admin-btn admin-btn-danger" style="padding: 8px 14px; font-size: 12px;" onclick="deleteRequest('${key}')">Sil</button>
                    </div>
                `;
            });
        });

        function updateAnnouncement() {
            let text = document.getElementById('announcementInput').value;
            db.ref('announcement').set(text).then(() => {
                showToast("✅ Duyuru güncellendi!");
            });
        }

        function addScript() {
            let title = document.getElementById('scriptTitle').value.trim();
            let desc = document.getElementById('scriptDesc').value.trim();
            let image = document.getElementById('scriptImage').value.trim();
            let code = document.getElementById('scriptCode').value.trim();

            if(!title || !code) {
                showToast("❌ Oyun adı ve script kodu zorunludur!");
                return;
            }

            db.ref('scripts').push({ title, desc, image, code }).then(() => {
                showToast("✅ Script başarıyla eklendi!");
                document.getElementById('scriptTitle').value = "";
                document.getElementById('scriptDesc').value = "";
                document.getElementById('scriptImage').value = "";
                document.getElementById('scriptCode').value = "";
            });
        }

        function deleteRequest(key) {
            db.ref('requests/' + key).remove().then(() => {
                showToast("🗑️ İstek silindi.");
            });
        }

        function toggleMenu() { document.querySelector('nav').classList.toggle('active'); }
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }
    </script>
</body>
</html>
