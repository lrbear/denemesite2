<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scriptler - Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin-top: 20px;
        }
        .card {
            background: #181922;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 12px;
            text-align: left;
            transition: 0.3s;
        }
        .card:hover {
            border-color: #5865F2;
            transform: translateY(-5px);
        }
        .card h3 {
            margin-bottom: 10px;
            color: #fff;
        }
        .card p {
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Hub v2.0</div>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="script.html" class="active">Scriptler</a>
            <a href="key.html">Key Sistemi</a>
        </nav>
    </header>

    <div class="container" style="justify-content: flex-start;">
        <h1>Script Listesi</h1>
        <p>Kullanıma hazır popüler oyun scriptlerimiz.</p>
        
        <div class="card-grid">
            <div class="card">
                <h3>Oyun Scripti #1</h3>
                <p>Gelişmiş özellikler, hızlı farm ve ESP desteği içerir.</p>
                <button class="btn" onclick="copyScript('loadstring(game:HttpGet(\'BURAYA_SCRIPT_1\'))()')">Scripti Kopyala</button>
            </div>
            <div class="card">
                <h3>Oyun Scripti #2</h3>
                <p>Özel arayüz ve optimize edilmiş performans.</p>
                <button class="btn" onclick="copyScript('loadstring(game:HttpGet(\'BURAYA_SCRIPT_2\'))()')">Scripti Kopyala</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Tüm Hakları Saklıdır.</p>
    </footer>

    <script>
        function copyScript(code) {
            navigator.clipboard.writeText(code);
            alert("Script başarıyla kopyalandı!");
        }
    </script>

</body>
</html>
