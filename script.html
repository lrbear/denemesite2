<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scriptler - Klakz Hub</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        .script-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; width: 100%; max-width: 900px; margin-bottom: 40px; }
        .script-card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid var(--border); padding: 25px; border-radius: 16px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
        .script-card:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2); }
        .tag { background: rgba(99, 102, 241, 0.15); color: var(--accent); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; margin-bottom: 12px; }
    </style>
</head>
<body>

    <div class="announcement-bar" id="topAnnouncement">Yükleniyor...</div>

    <header>
        <div class="logo">KLAKZ HUB</div>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="script.html" class="active">Scriptler</a>
            <a href="status.html">Durum</a>
            <a href="network.html">Projelerim</a>
            <a href="key.html">Key Sistemi</a>
            <a href="admin.html" style="color: var(--accent); font-weight: 700;">⚙️ Admin</a>
        </nav>
    </header>

    <div class="container" style="justify-content: flex-start;">
        <h1 style="font-size: 36px; margin-top: 20px;">Özel <span>Scriptler</span></h1>
        <p style="margin-bottom: 30px;">Admin panelinden eklenen en güncel scriptlere buradan ulaşabilirsin.</p>

        <div class="script-grid" id="scriptGrid"></div>
    </div>

    <div id="toast">Bildirim mesajı</div>
    <footer><p>&copy; 2026 Klakz Hub. Tüm hakları saklıdır.</p></footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAJuMNSxWFuNTO0xGriUo8QoaC9g-ie8WM",
            authDomain: "klakz-database.firebaseapp.com",
            databaseURL: "https://klakz-database-default-rtdb.firebaseio.com",
            projectId: "klakz-database",
            storageBucket: "klakz-database.firebasestorage.app",
            messagingSenderId: "437747915577",
            appId: "1:437747915577:web:f4ffa2f76d6d7a923966e8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        window.addEventListener('DOMContentLoaded', () => {
            db.ref('announcement').on('value', snap => {
                document.getElementById('topAnnouncement').textContent = snap.val() || "";
            });

            db.ref('scripts').on('value', snap => {
                let data = snap.val();
                let scriptsArray = data ? Object.keys(data).map(key => data[key]) : [];
                renderScripts(scriptsArray);
            });
        });

        function renderScripts(scripts) {
            const grid = document.getElementById('scriptGrid');
            grid.innerHTML = "";
            if(scripts.length === 0) {
                grid.innerHTML = "<p style='color:var(--text-muted);'>Henüz eklenmiş script bulunmuyor.</p>";
                return;
            }

            scripts.forEach((item, index) => {
                let btnId = "copyBtn_" + index;
                let encodedCode = encodeURIComponent(item.code);

                grid.innerHTML += `
                    <div class="script-card">
                        <div>
                            <span class="tag">${item.tag}</span>
                            <h3 style="color:#fff; font-size:20px; margin-bottom:8px;">${item.name}</h3>
                            <p style="color:var(--text-muted); font-size:13px; margin-bottom:20px;">${item.desc || 'Açıklama girilmemiş.'}</p>
                        </div>
                        <button id="${btnId}" class="btn" style="width:100%; justify-content:center;" onclick="copyScript('${encodedCode}', '${btnId}')">📋 Kopyala</button>
                    </div>
                `;
            });
        }

        // COOLDOWN SİSTEMİ (5 Saniye)
        function copyScript(encodedCode, btnId) {
            let code = decodeURIComponent(encodedCode);
            navigator.clipboard.writeText(code).then(() => {
                showToast("📋 Script panoya kopyalandı!");
                
                let btn = document.getElementById(btnId);
                let timeLeft = 5;
                
                btn.disabled = true;
                btn.style.opacity = "0.5";
                btn.style.cursor = "not-allowed";
                
                let timer = setInterval(() => {
                    btn.textContent = `⏳ Bekleyin (${timeLeft}s)`;
                    timeLeft--;
                    
                    if(timeLeft < 0) {
                        clearInterval(timer);
                        btn.disabled = false;
                        btn.style.opacity = "1";
                        btn.style.cursor = "pointer";
                        btn.textContent = "📋 Kopyala";
                    }
                }, 1000);
            });
        }

        function toggleMenu() { document.querySelector('nav').classList.toggle('active'); }
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }
    </script>
</body>
</html>
