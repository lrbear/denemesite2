<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scriptler - Klakz Hub</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        .search-box { width: 100%; max-width: 600px; padding: 14px 20px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; color: white; font-size: 16px; outline: none; margin-bottom: 10px; }
        .search-history { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 30px; width: 100%; max-width: 600px; }
        .history-tag { background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 5px 12px; border-radius: 20px; font-size: 12px; color: var(--text-muted); cursor: pointer; transition: 0.2s; }
        .history-tag:hover { background: var(--primary); color: white; }
        
        .script-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; width: 100%; }
        .script-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; backdrop-filter: blur(10px); display: flex; flex-direction: column; transition: 0.3s; }
        .script-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .script-thumb { width: 100%; height: 160px; object-fit: cover; background: #1a1c23; }
        .script-content { padding: 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .script-title { font-size: 18px; font-weight: 700; color: white; }
        .script-desc { font-size: 13px; color: var(--text-muted); flex: 1; }
        .script-btns { display: flex; gap: 10px; margin-top: 15px; }
        .btn-action { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; font-size: 13px; transition: 0.2s; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-copy { background: var(--primary); color: white; }
        .btn-copy:hover { background: var(--primary-hover); }
        .btn-report { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-report:hover { background: rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body>

    <div class="announcement-bar" id="topAnnouncement">Yükleniyor...</div>

    <header>
        <div class="logo">KLAKZ HUB</div>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="script.html" class="active">Scriptler</a>
            <a href="status.html">Durum</a>
            <a href="executors.html">Executor Rehberi</a>
            <a href="network.html">Projelerim</a>
            <a href="key.html">Key Sistemi</a>
            <a href="changelog.html">Güncellemeler</a>
            <a href="faq.html">SSS</a>
            <a href="request.html">İstek</a>
            <a href="admin.html" style="color: var(--accent); font-weight: 700;">⚙️ Admin</a>
        </nav>
    </header>

    <div class="container" style="align-items: center;">
        <h1 style="font-size: 36px; margin-bottom: 10px;">Script <span>Kütüphanesi</span></h1>
        <p style="color: var(--text-muted); margin-bottom: 25px;">Aradığın oyunu yaz ve en güncel Lua scriptine hemen ulaş.</p>

        <input type="text" id="searchInput" class="search-box" placeholder="Oyun veya script ara..." oninput="filterScripts()">
        <div class="search-history" id="searchHistory"></div>

        <div class="script-grid" id="scriptGrid">
            <p style="color: var(--text-muted); grid-column: 1/-1; text-align: center;">Scriptler yükleniyor...</p>
        </div>
    </div>

    <div id="toast">Bildirim mesajı</div>
    <footer><p>&copy; 2026 Klakz Hub. Tüm hakları saklıdır.</p></footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAJuMNSxWFuNTO0xGriUo8QoaC9g-ie8WM",
            authDomain: "klakz-database.firebaseapp.com",
            databaseURL: "https://klakz-database-default-rtdb.firebaseio.com",
            projectId: "klakz-database",
            storageBucket: "klakz-database.firebasestorage.app",
            messagingSenderId: "437747915577",
            appId: "1:437747915577:web:f4ffa2f76d6d7a923966e8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allScripts = [];

        window.addEventListener('DOMContentLoaded', () => {
            db.ref('announcement').on('value', snap => {
                document.getElementById('topAnnouncement').textContent = snap.val() || "";
            });

            db.ref('scripts').on('value', snap => {
                const data = snap.val();
                const grid = document.getElementById('scriptGrid');
                grid.innerHTML = "";
                allScripts = [];

                if(!data) {
                    grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center;">Henüz script eklenmemiş.</p>';
                    return;
                }

                Object.keys(data).forEach(key => {
                    let s = data[key];
                    s.id = key;
                    allScripts.push(s);
                });

                renderScripts(allScripts);
            });

            loadHistory();
        });

        function renderScripts(list) {
            const grid = document.getElementById('scriptGrid');
            grid.innerHTML = "";
            if(list.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center;">Aradığınız kriterlere uygun script bulunamadı.</p>';
                return;
            }

            list.forEach(s => {
                let thumb = s.image && s.image.trim() !== "" ? s.image : "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500&auto=format&fit=crop&q=60";
                grid.innerHTML += `
                    <div class="script-card">
                        <img src="${thumb}" class="script-thumb" alt="Oyun Görseli">
                        <div class="script-content">
                            <div class="script-title">${s.title}</div>
                            <div class="script-desc">${s.desc || "Açıklama bulunmuyor."}</div>
                            <div class="script-btns">
                                <button class="btn-action btn-copy" onclick="copyScript('${s.code}')">📋 Kopyala</button>
                                <button class="btn-action btn-report" onclick="reportScript('${s.title}')">⚠️ Patlak Bildir</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterScripts() {
            let query = document.getElementById('searchInput').value.toLowerCase().trim();
            let filtered = allScripts.filter(s => s.title.toLowerCase().includes(query) || (s.desc && s.desc.toLowerCase().includes(query)));
            renderScripts(filtered);

            if(query.length > 2) {
                saveHistory(query);
            }
        }

        function saveHistory(term) {
            let history = JSON.parse(localStorage.getItem('klakz_search_history') || '[]');
            if(!history.includes(term)) {
                history.unshift(term);
                if(history.length > 5) history.pop();
                localStorage.setItem('klakz_search_history', JSON.stringify(history));
                loadHistory();
            }
        }

        function loadHistory() {
            let history = JSON.parse(localStorage.getItem('klakz_search_history') || '[]');
            let box = document.getElementById('searchHistory');
            box.innerHTML = "";
            history.forEach(h => {
                box.innerHTML += `<div class="history-tag" onclick="searchByTag('${h}')">${h}</div>`;
            });
        }

        function searchByTag(term) {
            document.getElementById('searchInput').value = term;
            filterScripts();
        }

        function copyScript(code) {
            navigator.clipboard.writeText(code).then(() => {
                showToast("✅ Script başarıyla kopyalandı!");
            });
        }

        function reportScript(title) {
            db.ref('reports').push({
                script: title,
                time: new Date().toLocaleString()
            }).then(() => {
                showToast("🚨 Patlak bildirimi yöneticiye iletildi!");
            });
        }

        function toggleMenu() { document.querySelector('nav').classList.toggle('active'); }
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }
    </script>
</body>
</html>
