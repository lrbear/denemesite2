<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projelerim - Klakz Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        if (!sessionStorage.getItem('klakz_verified')) { window.location.href = 'key.html'; }
    </script>
    <style>
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; width: 100%; max-width: 1000px; }
        .project-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 25px; display: flex; flex-direction: column; gap: 15px; backdrop-filter: blur(10px); transition: 0.3s; }
        .project-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .btn-project { background: var(--primary); color: white; text-decoration: none; padding: 12px; border-radius: 10px; font-weight: 700; text-align: center; display: block; transition: 0.2s; }
        .btn-project:hover { background: var(--primary-hover); }
    </style>
</head>
<body>

    <div class="announcement-bar" id="topAnnouncement">Yükleniyor...</div>

    <header>
        <div class="logo">KLAKZ HUB</div>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="script.html">Scriptler</a>
            <a href="status.html">Durum</a>
            <a href="executors.html">Executor Rehberi</a>
            <a href="network.html" class="active">Projelerim</a>
            <a href="key.html">Key Sistemi</a>
            <a href="changelog.html">Güncellemeler</a>
            <a href="request.html">İstek</a>
            <a href="admin.html" style="color: var(--accent); font-weight: 700;">⚙️ Admin</a>
        </nav>
    </header>

    <div class="container" style="align-items: center;">
        <h1 style="font-size: 36px; margin-bottom: 10px;">Geliştirici <span>Projelerim</span></h1>
        <p style="color: var(--text-muted); margin-bottom: 30px; text-align: center;">Admin paneli üzerinden eklenen özel projelerim.</p>

        <div class="projects-grid" id="projectsGrid">
            <p style="color: var(--text-muted); grid-column: 1/-1; text-align: center;">Projeler yükleniyor...</p>
        </div>
    </div>

    <footer><p>&copy; 2026 Klakz Hub. Tüm hakları saklıdır.</p></footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAJuMNSxWFuNTO0xGriUo8QoaC9g-ie8WM",
            authDomain: "klakz-database.firebaseapp.com",
            databaseURL: "https://klakz-database-default-rtdb.firebaseio.com",
            projectId: "klakz-database",
            storageBucket: "klakz-database.firebasestorage.app",
            messagingSenderId: "437747915577",
            appId: "1:437747915577:web:f4ffa2f76d6d7a923966e8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('announcement').on('value', snap => { document.getElementById('topAnnouncement').textContent = snap.val() || ""; });

        db.ref('projects').on('value', snap => {
            const data = snap.val();
            const grid = document.getElementById('projectsGrid');
            grid.innerHTML = "";
            if(!data) { grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center;">Henüz proje eklenmemiş.</p>'; return; }
            Object.values(data).forEach(p => {
                grid.innerHTML += `<div class="project-card"><strong style="color: white; font-size: 18px;">${p.title}</strong><p style="color: var(--text-muted); font-size: 13px; flex: 1;">${p.desc || "Açıklama yok."}</p><a href="${p.link}" target="_blank" class="btn-project">Projeyi İncele / Git</a></div>`;
            });
        });

        function toggleMenu() { document.querySelector('nav').classList.toggle('active'); }
    </script>
</body>
</html>
